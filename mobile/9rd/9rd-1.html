<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>벽돌깨기</title><style>body{margin:8px;font:16px sans-serif}header,#g{width:min(100%,800px);margin:auto}header{display:flex;justify-content:space-between}#g{aspect-ratio:4/3}canvas{display:block;width:100%!important;height:100%!important;touch-action:none}</style><header>점수 <b id="s">0</b><button id="r">다시</button></header><div id="g"></div><script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script><script>const W=800,H=600,S=document.querySelector("#s");class G extends Phaser.Scene{constructor(){super("g")}create(){this.n=0;S.textContent=0;this.w=1;if(!this.textures.exists("b")){let g=this.make.graphics({add:false});g.fillStyle(0xffffff).fillRect(0,0,70,20);g.generateTexture("b",70,20);g.clear().fillStyle(0xffffff).fillRect(0,0,100,14);g.generateTexture("p",100,14);g.clear().fillStyle(0xffffff).fillCircle(7,7,7);g.generateTexture("o",14,14);g.destroy()}this.physics.world.setBounds(0,0,W,H,true,true,true,false);this.p=this.physics.add.image(400,540,"p").setImmovable().setCollideWorldBounds(true);this.p.body.allowGravity=false;this.b=this.physics.add.image(400,522,"o").setBounce(1).setCollideWorldBounds(true);this.b.body.allowGravity=false;this.rs=this.physics.add.staticGroup();this.fill();this.physics.add.collider(this.b,this.p,(b,p)=>{let x=(b.x-p.x)/(p.displayWidth/2);b.setVelocity(x*380,-380)});this.physics.add.collider(this.b,this.rs,(b,r)=>{r.destroy();S.textContent=this.n+=10;if(!this.rs.countActive()){this.rs.clear(true,true);this.fill();this.park()}});let f=this.add.zone(400,598,800,4);this.physics.add.existing(f,true);this.physics.add.overlap(this.b,f,()=>this.park());this.t=this.add.text(400,300,"클릭/Space 시작",{color:"#fff",fontSize:18}).setOrigin(.5);this.k=this.input.keyboard.createCursorKeys();this.input.keyboard.on("keydown-SPACE",this.launch,this);this.input.on("pointermove",e=>this.move(e.worldX));this.input.on("pointerdown",this.launch,this)}fill(){for(let y=0;y<5;y++)for(let x=0;x<9;x++)this.rs.create(88+x*78,90+y*27,"b")}move(x){this.p.x=Phaser.Math.Clamp(x,50,750);if(this.w)this.b.x=this.p.x}update(_,d){let x=(this.k.left.isDown?-1:0)+(this.k.right.isDown?1:0);if(x)this.move(this.p.x+x*d*.5);if(this.w)this.b.setPosition(this.p.x,522)}launch(){if(this.w){this.w=0;this.t.setVisible(false);this.b.setVelocity(130,-380)}}park(){if(!this.w){this.w=1;this.b.setVelocity(0);this.b.setPosition(this.p.x,522);this.t.setVisible(true)}}}const g=new Phaser.Game({type:Phaser.AUTO,width:W,height:H,parent:"g",backgroundColor:"#111",scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},physics:{default:"arcade",arcade:{gravity:{y:0}}},scene:G});document.querySelector("#r").onclick=()=>g.scene.start("g")</script></html>
