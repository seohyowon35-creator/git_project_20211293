<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SNS | 효원 포트폴리오</title>
  <link rel="stylesheet" href="mportoplio.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a href="mintro.html" class="logo">효원</a>
      <nav>
        <ul class="nav">
          <li><a href="mintro.html">소개</a></li>
          <li><a href="minfo.html">정보</a></li>
          <li><a href="mustudy.html">학습</a></li>
          <li><a href="mcareer.html">경력</a></li>
          <li><a href="idea.html">아이디어</a></li>
          <li><a href="sns.html" class="active">SNS</a></li>
          <li><a href="map.html">지도</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1 class="page-title">SNS</h1>
    <p class="lead">아래 방법으로 연락하실 수 있습니다.</p>

    <section>
      <h2>주소 검색</h2>
      <div class="btn-row">
        <input type="text" id="address" class="addr-input" placeholder="주소 검색 버튼을 눌러주세요" readonly>
        <button type="button" class="btn" onclick="searchAddress()">주소 검색</button>
      </div>
      <div id="postcode-wrap" class="postcode-wrap" hidden></div>
    </section>

    <section>
      <h2>연락처</h2>
      <div class="contact-grid">
        <div class="contact-card">
          <div class="icon">☎</div>
          <p class="label">전화번호</p>
          <p class="value">010-1234-5678</p>
          <a href="tel:010-1234-5678" class="btn primary">전화하기</a>
        </div>
        <div class="contact-card">
          <div class="icon">✉</div>
          <p class="label">이메일</p>
          <p class="value">hyowon@example.com</p>
          <a href="mailto:hyowon@example.com" class="btn primary">보내기</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    &copy; 2026 효원. All rights reserved.
  </footer>

  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script>
    function searchAddress() {
      var wrap = document.getElementById('postcode-wrap');

      if (typeof daum === 'undefined' || !daum.Postcode) {
        alert('주소 검색을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
        return;
      }

      wrap.innerHTML = '';
      wrap.hidden = false;

      new daum.Postcode({
        width: '100%',
        height: '100%',
        oncomplete: function (data) {
          document.getElementById('address').value = data.address;
          wrap.hidden = true;
        },
        onclose: function () {
          wrap.hidden = true;
        }
      }).embed(wrap);
    }
  </script>
</body>
</html>
