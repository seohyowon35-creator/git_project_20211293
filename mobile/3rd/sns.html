  <main>
    <h1 class="page-title">SNS</h1>
    <p class="lead">아래 방법으로 연락하실 수 있습니다.</p>

    <section>
      <h2>주소 검색</h2>
      <div class="btn-row">
        <input type="text" id="address" class="addr-input" placeholder="주소 검색 버튼을 눌러주세요" readonly>
        <button type="button" class="btn" onclick="searchAddress()">주소 검색</button>
      </div>
      <div id="postcode-wrap" class="postcode-wrap" hidden></div>
    </section>

    <section>
      <h2>연락처</h2>
      <div class="contact-grid">
        <div class="contact-card">
          <div class="icon">☎</div>
          <p class="label">전화번호</p>
          <p class="value">010-1234-5678</p>
          <a href="tel:010-1234-5678" class="btn primary">전화하기</a>
        </div>
        <div class="contact-card">
          <div class="icon">✉</div>
          <p class="label">이메일</p>
          <p class="value">hyowon@example.com</p>
          <a href="mailto:hyowon@example.com" class="btn primary">보내기</a>
        </div>
        <div class="contact-card">
          <div class="icon code">&lt;/&gt;</div>
          <p class="label">포트폴리오</p>
          <p class="value">GitHub</p>
          <a href="https://github.com/seohyowon35-creator" target="_blank" rel="noopener" class="btn primary">보러가기</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    &copy; 2026 효원. All rights reserved.
  </footer>

  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script>
    function searchAddress() {
      var wrap = document.getElementById('postcode-wrap');

      if (typeof daum === 'undefined' || !daum.Postcode) {
        alert('주소 검색을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
        return;
      }

      wrap.innerHTML = '';
      wrap.hidden = false;

      new daum.Postcode({
        width: '100%',
        height: '100%',
        oncomplete: function (data) {
          document.getElementById('address').value = data.address;
          wrap.hidden = true;
        },
        onclose: function () {
          wrap.hidden = true;
        }
      }).embed(wrap);
    }
  </script>

  <!-- 배경음악 -->
  <audio id="bgm" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop preload="none"></audio>
  <button type="button" id="bgm-btn" class="bgm-btn" onclick="toggleBgm()">♪ 음악 켜기</button>
  <script>
    (function () {
      var audio = document.getElementById('bgm');
      var btn = document.getElementById('bgm-btn');

      function paint() {
        btn.textContent = audio.paused ? '♪ 음악 켜기' : '♪ 음악 끄기';
      }

      function remember(value) {
        try { localStorage.setItem('bgm', value); } catch (e) {}
      }

      window.toggleBgm = function () {
        if (audio.paused) {
          audio.play();
          remember('on');
        } else {
          audio.pause();
          remember('off');
        }
      };

      audio.addEventListener('play', paint);
      audio.addEventListener('pause', paint);

      // 다른 페이지로 넘어가도 켜둔 상태를 이어서 재생한다
      try {
        if (localStorage.getItem('bgm') === 'on') {
          audio.play().catch(function () {});
        }
      } catch (e) {}

      paint();
    })();
  </script>
</body>
</html>
